services:

  user-service:
    image: user-service:1.1
    container_name: user-service-container
    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: 5001
    ports:
      - "5001:5001"
    networks:
      - cloud-native-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  product-service:
    image: product-service:1.1
    container_name: product-service-container
    environment:
      SERVICE_NAME: product-service
      SERVICE_PORT: 5002
    ports:
      - "5002:5002"
    networks:
      - cloud-native-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  order-service:
    image: order-service:1.2
    container_name: order-service-container
    environment:
      SERVICE_NAME: order-service
      SERVICE_PORT: 5003
      USER_SERVICE_URL: http://user-service-container:5001
      PRODUCT_SERVICE_URL: http://product-service-container:5002
      PAYMENT_SERVICE_URL: http://payment-service-container:5004
    ports:
      - "5003:5003"
    networks:
      - cloud-native-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  payment-service:
    image: payment-service:1.1
    container_name: payment-service-container
    environment:
      SERVICE_NAME: payment-service
      SERVICE_PORT: 5004
    ports:
      - "5004:5004"
    networks:
      - cloud-native-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway-container
    ports:
      - "8080:8080"
    networks:
      - cloud-native-network

networks:
  cloud-native-network:
    driver: bridge