apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-prometheus-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: nginx-prometheus-exporter
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: nginx-prometheus-exporter
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: user-service
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: user-service
  endpoints:
    - targetPort: 5001
      interval: 15s
      path: /metrics
