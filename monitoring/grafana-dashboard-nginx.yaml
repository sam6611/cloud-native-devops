apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nginx
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nginx-gateway.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "NGINX Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "nginx_up",
              "legendFormat": "Status"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "title": "Active Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "nginx_connections_active",
              "legendFormat": "Active"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 100 } ] }
            },
            "overrides": []
          }
        },
        {
          "title": "Total HTTP Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "nginx_http_requests_total",
              "legendFormat": "Total"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "title": "Requests per Second",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(nginx_http_requests_total[5m])",
              "legendFormat": "RPS"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 }, "overrides": [] }
        },
        {
          "title": "Accepted vs Handled Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(nginx_connections_accepted[5m]) - rate(nginx_connections_handled[5m])",
              "legendFormat": "Dropped/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.01 } ] }
            },
            "overrides": []
          }
        },
        {
          "title": "Requests per Second (over time)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(nginx_http_requests_total[5m])",
              "legendFormat": "Requests/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 20, "gradientMode": "scheme" } }, "overrides": [] }
        },
        {
          "title": "Connection States",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "nginx_connections_active", "legendFormat": "Active" },
            { "expr": "nginx_connections_reading", "legendFormat": "Reading" },
            { "expr": "nginx_connections_writing", "legendFormat": "Writing" },
            { "expr": "nginx_connections_waiting", "legendFormat": "Waiting" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] }
        },
        {
          "title": "Accepted & Handled Connections (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(nginx_connections_accepted[5m])", "legendFormat": "Accepted/s" },
            { "expr": "rate(nginx_connections_handled[5m])", "legendFormat": "Handled/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 15 } }, "overrides": [] }
        }
      ],
      "schemaVersion": 39,
      "tags": ["nginx", "api-gateway", "cloud-native-devops"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "NGINX API Gateway",
      "uid": "nginx-api-gateway"
    }
