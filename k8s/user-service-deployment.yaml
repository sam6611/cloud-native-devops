apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: 847283080148.dkr.ecr.ap-south-1.amazonaws.com/cloud-native-devops/user-service:1.0
          ports:
            - containerPort: 5001
