name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent concurrent deployments to the same environment.
# On push to main, cancel any in-progress workflow and run the new one.
# On pull requests, allow concurrent runs (they target different branches).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r user-service/requirements.txt
          pip install -r product-service/requirements.txt
          pip install -r order-service/requirements.txt
          pip install -r payment-service/requirements.txt

      - name: Verify Python files compile
        run: |
          python -m py_compile user-service/app.py
          python -m py_compile product-service/app.py
          python -m py_compile order-service/app.py
          python -m py_compile payment-service/app.py

      - name: Write job summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python dependencies installed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| user-service syntax | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| product-service syntax | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| order-service syntax | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| payment-service syntax | ✅ |" >> $GITHUB_STEP_SUMMARY

  docker-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847283080148:role/cloud-native-devops-github-actions
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build all service images
        run: |
          docker build -t user-service:ci    ./user-service
          docker build -t product-service:ci ./product-service
          docker build -t order-service:ci   ./order-service
          docker build -t payment-service:ci ./payment-service
          docker build -t api-gateway:ci     ./api-gateway

      # --- Trivy Scans (HIGH+CRITICAL, ignore unfixed, fail on findings) ---

      - name: Scan user-service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "user-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan product-service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "product-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan order-service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "order-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan payment-service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "payment-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan api-gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "api-gateway:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      # --- Tag and push to ECR ---

      - name: Tag images for ECR
        env:
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag user-service:ci    $ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG
          docker tag product-service:ci $ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG
          docker tag order-service:ci   $ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG
          docker tag payment-service:ci $ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG
          docker tag api-gateway:ci     $ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG

      - name: Push images to ECR
        env:
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG

      # --- GitOps update ---

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: sam6611/cloud-native-devops-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/user-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG|" gitops/k8s/user-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/product-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG|" gitops/k8s/product-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/order-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG|" gitops/k8s/order-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/payment-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG|" gitops/k8s/payment-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/api-gateway:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG|" gitops/k8s/api-gateway-deployment.yaml

      - name: Validate updated Kubernetes manifests
        run: |
          # Use kubectl --dry-run=client to validate all manifests
          kubectl apply --dry-run=client -f gitops/k8s/ 2>&1 || {
            echo "::warning::Manifest validation failed — review k8s/ directory for errors"
            exit 1
          }

      - name: Commit and push GitOps changes
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          # Only commit if there are actual changes (prevents empty commits on re-runs)
          if git diff --cached --exit-code; then
            echo "No manifest changes detected — skipping GitOps commit"
          else
            git commit -m "Update images to $IMAGE_TAG"
            git push
          fi

      - name: Write deployment summary
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | \`$ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| product-service | \`$ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| order-service | \`$ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| payment-service | \`$ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| api-gateway | \`$ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy scan: HIGH/CRITICAL vulnerabilities checked (ignore-unfixed: true)" >> $GITHUB_STEP_SUMMARY
          echo "- AWS auth: OIDC (no static keys)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitOps" >> $GITHUB_STEP_SUMMARY
          echo "- GitOps repository updated with new image tags" >> $GITHUB_STEP_SUMMARY
          echo "- Argo CD will detect the change and sync automatically" >> $GITHUB_STEP_SUMMARY