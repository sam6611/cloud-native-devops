name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r user-service/requirements.txt
          pip install -r product-service/requirements.txt
          pip install -r order-service/requirements.txt
          pip install -r payment-service/requirements.txt

      - name: Verify Python files
        run: |
          python -m py_compile user-service/app.py
          python -m py_compile product-service/app.py
          python -m py_compile order-service/app.py
          python -m py_compile payment-service/app.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get OIDC token claims
        shell: bash
        run: |
          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          python -c "
          import base64, json
          token = '''$OIDC_TOKEN'''
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('aud:', claims.get('aud'))
          print('sub:', claims.get('sub'))
          print('repository:', claims.get('repository'))
          print('ref:', claims.get('ref'))
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847283080148:role/cloud-native-devops-github-actions
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build user-service image
        run: docker build -t user-service:ci ./user-service

      - name: Build product-service image
        run: docker build -t product-service:ci ./product-service

      - name: Build order-service image
        run: docker build -t order-service:ci ./order-service

      - name: Build payment-service image
        run: docker build -t payment-service:ci ./payment-service

      - name: Build api-gateway image
        run: docker build -t api-gateway:ci ./api-gateway

      - name: Scan user-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "user-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan product-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "product-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan order-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "order-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan payment-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "payment-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan api-gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "api-gateway:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"
          