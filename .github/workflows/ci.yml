name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r user-service/requirements.txt
          pip install -r product-service/requirements.txt
          pip install -r order-service/requirements.txt
          pip install -r payment-service/requirements.txt

      - name: Verify Python files
        run: |
          python -m py_compile user-service/app.py
          python -m py_compile product-service/app.py
          python -m py_compile order-service/app.py
          python -m py_compile payment-service/app.py

  docker-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847283080148:role/cloud-native-devops-github-actions
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build user-service image
        run: docker build -t user-service:ci ./user-service

      - name: Build product-service image
        run: docker build -t product-service:ci ./product-service

      - name: Build order-service image
        run: docker build -t order-service:ci ./order-service

      - name: Build payment-service image
        run: docker build -t payment-service:ci ./payment-service

      - name: Build api-gateway image
        run: docker build -t api-gateway:ci ./api-gateway

      - name: Scan user-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "user-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan product-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "product-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan order-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "order-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan payment-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "payment-service:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Scan api-gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "api-gateway:ci"
          vuln-type: "os,library"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Tag images for Amazon ECR
        env:
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag user-service:ci $ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG
          docker tag product-service:ci $ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG
          docker tag order-service:ci $ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG
          docker tag payment-service:ci $ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG
          docker tag api-gateway:ci $ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG

      - name: Push images to Amazon ECR
        env:
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: sam6611/cloud-native-devops-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: 847283080148.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/user-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/user-service:$IMAGE_TAG|" gitops/k8s/user-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/product-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/product-service:$IMAGE_TAG|" gitops/k8s/product-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/order-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/order-service:$IMAGE_TAG|" gitops/k8s/order-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/payment-service:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/payment-service:$IMAGE_TAG|" gitops/k8s/payment-service-deployment.yaml
          sed -i "s|$ECR_REGISTRY/cloud-native-devops/api-gateway:[^\" ]*|$ECR_REGISTRY/cloud-native-devops/api-gateway:$IMAGE_TAG|" gitops/k8s/api-gateway-deployment.yaml

      - name: Commit and push GitOps changes
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/
          git commit -m "Update images to $IMAGE_TAG"
          git push