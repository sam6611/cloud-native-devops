name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r user-service/requirements.txt
          pip install -r product-service/requirements.txt
          pip install -r order-service/requirements.txt
          pip install -r payment-service/requirements.txt

      - name: Verify Python files
        run: |
          python -m py_compile user-service/app.py
          python -m py_compile product-service/app.py
          python -m py_compile order-service/app.py
          python -m py_compile payment-service/app.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build user-service image
        run: docker build -t user-service:ci ./user-service

      - name: Build product-service image
        run: docker build -t product-service:ci ./product-service

      - name: Build order-service image
        run: docker build -t order-service:ci ./order-service

      - name: Build payment-service image
        run: docker build -t payment-service:ci ./payment-service

      - name: Build api-gateway image
        run: docker build -t api-gateway:ci ./api-gateway